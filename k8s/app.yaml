# k8s/app.yaml – TempConverter Deployment + Service (NodePort) + Ingress
# Apply: kubectl apply -f k8s/app.yaml
#
# Skaliranje na 3 replike:
#   kubectl scale deployment tempconverter --replicas=3

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempconverter
  namespace: default
  labels:
    app: tempconverter
spec:
  replicas: 2                   # Dvije replike aplikacije (zahtjev 6b)
  selector:
    matchLabels:
      app: tempconverter
  template:
    metadata:
      labels:
        app: tempconverter
    spec:
      # Anti-affinity: Kubernetes preferira rasporediti replike na razlicite
      # nodeove. Koristi se 'preferred' (a ne 'required') kako bi na lokalnom
      # single-node minikube clusteru sve replike i dalje radile (Running),
      # dok bi se u produkcijskom multi-node clusteru rasporedile na razlicite
      # nodeove (zahtjev 6b: replike ne na istom nodeu).
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - tempconverter
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: tempconverter
          image: lsirac/tempconverter:latest
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: "mysql"          # Naziv MySQL Servicea
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: tempconverter-secret
                  key: db-user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: tempconverter-secret
                  key: db-pass
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: tempconverter-secret
                  key: db-name
            - name: STUDENT
              value: "Lsirac"
            - name: COLLEGE
              value: "Algebra Bernays University"
            - name: FLASK_APP
              value: "app.py"
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30

---
# NodePort Service – eksponira aplikaciju lokalno na minikubeu (port 31041).
# Interni port Servicea je 80, preusmjeren na containerPort 5000.
apiVersion: v1
kind: Service
metadata:
  name: tempconverter-svc
  namespace: default
spec:
  selector:
    app: tempconverter
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 31041
  type: NodePort

---
# Ingress – produkcijsko izlaganje aplikacije vanjskom svijetu preko porta 80
# (zahtjev 6a). Zahtijeva instaliran Ingress Controller (npr. nginx-ingress).
# Na lokalnom minikubeu koristi se NodePort (gore), dok Ingress predstavlja
# produkcijski put izlaganja preko standardnog porta 80.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tempconverter-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: tempconverter.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tempconverter-svc
                port:
                  number: 80
