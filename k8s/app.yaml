# k8s/app.yaml – TempConverter Deployment + Service + Ingress
# Apply: kubectl apply -f k8s/app.yaml
#
# Scale to 3 replicas:
#   kubectl scale deployment tempconverter --replicas=3

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempconverter
  namespace: default
  labels:
    app: tempconverter
spec:
  replicas: 2                   # Two app replicas (requirement)
  selector:
    matchLabels:
      app: tempconverter
  template:
    metadata:
      labels:
        app: tempconverter
    spec:
      # Anti-affinity: ensures no two replicas land on the same node (requirement)
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - tempconverter
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: tempconverter
          image: yourdockerhubuser/tempconverter:latest
          ports:
            - containerPort: 5000
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: tempconverter-secret
                  key: db-user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: tempconverter-secret
                  key: db-pass
            - name: DB_HOST
              value: "mysql"    # Matches the MySQL Service name
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: tempconverter-secret
                  key: db-name
            - name: STUDENT
              value: "Your Name Here"
            - name: COLLEGE
              value: "Algebra Bernays University"
            - name: FLASK_APP
              value: "app.py"
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30

---
# ClusterIP Service – internal load balancing between app pods
apiVersion: v1
kind: Service
metadata:
  name: tempconverter-svc
  namespace: default
spec:
  selector:
    app: tempconverter
  ports:
    - port: 80
      targetPort: 5000
  type: ClusterIP

---
# Ingress – exposes the app externally over port 80 (requirement)
# Requires an Ingress Controller (e.g. nginx-ingress) to be installed
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tempconverter-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: tempconverter.local   # Change to your actual hostname / domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tempconverter-svc
                port:
                  number: 80

# ─────────────────────────────────────────────
# SCALING DOCUMENTATION
# ─────────────────────────────────────────────
#
# Scale app to 3 replicas imperatively:
#   kubectl scale deployment tempconverter --replicas=3
#
# Or update the replicas field above to 3 and re-apply:
#   kubectl apply -f k8s/app.yaml
#
# Verify pods are on different nodes:
#   kubectl get pods -o wide
#
# Note: With podAntiAffinity set to required, you need at least 3 nodes for 3 replicas.
# ─────────────────────────────────────────────
