# k8s/secret.yaml
# Base64-encoded database credentials
# Generate your own: echo -n "value" | base64
#
# Current values (base64):
#   appuser     → YXBwdXNlcg==
#   apppassword → YXBwcGFzc3dvcmQ=
#   tempconverterdb → dGVtcGNvbnZlcnRlcmRi
#   rootpassword → cm9vdHBhc3N3b3Jk
#
# Apply: kubectl apply -f k8s/secret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: tempconverter-secret
  namespace: default
type: Opaque
data:
  db-user: YXBwdXNlcg==
  db-pass: YXBwcGFzc3dvcmQ=
  db-name: dGVtcGNvbnZlcnRlcmRi
  db-root-pass: cm9vdHBhc3N3b3Jk
